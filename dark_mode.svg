<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest" width="800" height="480">
    <style>
        .terminal { font-family: 'Ubuntu Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; font-size: 15px; }
        .bg { fill: #1e1e1e; }
        .bar { fill: #2d2d2d; }
        .btn-close { fill: #ff5f56; }
        .btn-min { fill: #ffbd2e; }
        .btn-max { fill: #27c93f; }
        .text-main { fill: #d4d4d4; }
        .prompt-user { fill: #4af626; font-weight: bold; }
        .prompt-dir { fill: #3b8eea; font-weight: bold; }
        .prompt-sym { fill: #d4d4d4; }
        .key { fill: #56b6c2; font-weight: bold; }
        .add { fill: #27c93f; font-weight: bold; }
        .del { fill: #ff5f56; font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .cursor { fill: #d4d4d4; animation: blink 1s step-end infinite; }
    </style>
    <rect width="800" height="480" rx="8" class="bg" stroke="#3c3c3c" stroke-width="1"/>
    <path d="M 0 8 Q 0 0 8 0 L 792 0 Q 800 0 800 8 L 800 30 L 0 30 Z" class="bar"/>
    <circle cx="20" cy="15" r="6" class="btn-close"/>
    <circle cx="40" cy="15" r="6" class="btn-min"/>
    <circle cx="60" cy="15" r="6" class="btn-max"/>
    <text x="400" y="20" fill="#a0a0a0" font-family="sans-serif" font-size="13" text-anchor="middle">eduardo@dev: ~</text>
    
    <g class="terminal text-main">
        <!-- Neofetch command -->
        <text x="20" y="60"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> cat dev_profile.txt</text>
        
        <text x="20" y="90">--------------------------------------------------------------------------</text>
        <text x="20" y="115"><tspan class="key">Uptime:</tspan>         <tspan id="age_data_dots"> </tspan><tspan id="age_data">20 years, 3 months, 26 days</tspan></text>
        <text x="20" y="135"><tspan class="key">OS:</tspan>             Windows 11, WSL2 Ubuntu, Fedora</text>
        <text x="20" y="155"><tspan class="key">Degree:</tspan>       Systems Analysis and Development</text>
        <text x="20" y="175"><tspan class="key">Role:</tspan>        IT Support &amp; Infrastructure -&gt; DevOps/Cloud</text>
        <text x="20" y="195"><tspan class="key">Stack.Infra:</tspan>  Linux, Windows, TCP/IP, DNS, Docker, Git</text>
        <text x="20" y="215"><tspan class="key">Stack.Code:</tspan> Python, Java, Spring Boot, SQL</text>
        <text x="20" y="235"><tspan class="key">Tools:</tspan>    GitHub Actions, Power Automate, Power BI, FastAPI</text>
        <text x="20" y="255"><tspan class="key">Learning:</tspan>    Azure AZ-104, CI/CD pipelines</text>
        <text x="20" y="275"><tspan class="key">Hobbies:</tspan>        Guitar, Racing Games, Fighting Games, Hardware, Soulslikes</text>
        <text x="20" y="295">--------------------------------------------------------------------------</text>
        
        <!-- GitHub Stats Command -->
        <text x="20" y="335"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> ./fetch_github_stats.sh</text>
        
        <text x="20" y="365">Repos:<tspan id="repo_data_dots"> .... </tspan><tspan id="repo_data">11</tspan> {Contributed: <tspan id="contrib_data_dots"></tspan><tspan id="contrib_data">12</tspan>} | Stars:<tspan id="star_data_dots"> ............. </tspan><tspan id="star_data">0</tspan></text>
        <text x="20" y="385">Commits:<tspan id="commit_data_dots"> ................... </tspan><tspan id="commit_data">116</tspan> | Followers:<tspan id="follower_data_dots"> ......... </tspan><tspan id="follower_data">3</tspan></text>
        <text x="20" y="405">Lines of Code:<tspan id="loc_data_dots"> ... </tspan><tspan id="loc_data">26,512</tspan> ( <tspan id="loc_add_dots"></tspan><tspan id="loc_add" class="add">31,452</tspan>++, <tspan id="loc_del_dots">. </tspan><tspan id="loc_del" class="del">4,940</tspan>-- )</text>
        
        <text x="20" y="445"><tspan class="prompt-user">eduardo@dev</tspan><tspan class="prompt-sym">:</tspan><tspan class="prompt-dir">~</tspan><tspan class="prompt-sym">$</tspan> <tspan class="cursor">█</tspan></text>
    </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>